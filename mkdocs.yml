site_name: AES Encryption and Steganography
site_description: API and implementation documentation for password-based authenticated encryption.
site_url: "https://caliso28.github.io/Chiffrement_AES_Et_Steganographie/"

theme:
  name: material

  font:
    text: Open Sans
    code: Source Code Pro

  icon:
    logo: octicons/shield-lock-16

  palette: 
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - content.code.copy

nav:
  - Home: index.md
  - User guide:
      - Encryption workflows: workflows.md
      - Encrypted stream format: format.md
      - Benchmarks: benchmarks.md
  - API reference: api.md

docs_dir: docs

hooks:
  - scripts/package_docs.py

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
  - toc:
      permalink: true
  - material.extensions.preview:
      configurations:
        - targets:
            include:
              - "**"

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            filters:
              - "!^__"
            inherited_members: false
            members: true
            show_if_no_docstring: true
            show_root_full_path: false
            show_root_heading: true
            show_source: false
  - exporter:
      formats:
        pdf:
          enabled: !ENV [MKDOCS_EXPORTER_PDF_ENABLED, true]
          concurrency: 4
          aggregator:
            enabled: true
            output: documentation.pdf
      buttons:
        - title: View as PDF
          icon: material-file-move-outline
          enabled: true
          attributes:
            target: _blank
            href: index.pdf
        - title: Download as PDF
          icon: material-file-download-outline
          enabled: true
          attributes:
            href: index.pdf
            download: index.pdf

copyright: Copyright &copy; 2026 Antonin Fauvet
